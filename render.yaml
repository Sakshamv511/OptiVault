# Render Blueprint for OptiVault Backend Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: optivault-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://optivault-warehouse.vercel.app
      - key: PLATFORM_ADMIN_EMAIL
        value: admin@optivault.internal
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: '"OptiVault Platform" <optivault601@gmail.com>'
